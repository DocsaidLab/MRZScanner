[project]
name = "mrzscanner_docsaid"
version = "1.0.7"
description = "A Python package for recognizing and extracting MRZ from visa and passport documents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "capybara_docsaid>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
cpu = ["capybara_docsaid[onnxruntime]>=1.0.0,<2.0.0"]
gpu = ["capybara_docsaid[onnxruntime-gpu]>=1.0.0,<2.0.0"]

[project.urls]
Repository = "https://github.com/DocsaidLab/MRZScanner.git"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "numpy>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mrzscanner"]

[tool.hatch.build.targets.sdist]
include = ["mrzscanner/**"]
exclude = [
    "data",
    "docker",
    "demo",
    "docs",
    "model",
    "model.*",
    "tests",
    "benchmark",
    "reference",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
